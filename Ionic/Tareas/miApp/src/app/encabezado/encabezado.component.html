<ion-header>
  <ion-toolbar [color]="color">
    @if (volverA) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="volverA"></ion-back-button>
      </ion-buttons>
    }
    <ion-title>{{ titulo }}</ion-title>

    @if (subtitulo) {
      <ion-title size="small">{{ subtitulo }}</ion-title>
    }

    @if (mostrarAcerca) {
      <ion-buttons slot="end">
        <ion-button [routerLink]="[mostrarAcerca]">Acerca de</ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>
